# Runs every test on each push and pull request.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest, SQLite and PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: mmk_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends swi-prolog-nox
      - run: pip install -r backend/requirements.txt
      - name: pytest on SQLite
        working-directory: backend
        run: python -m pytest -q
      - name: pytest on PostgreSQL
        working-directory: backend
        env: { TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/mmk_test" }
        run: python -m pytest -q

  frontend:
    name: Frontend (unit tests, build, end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends swi-prolog-nox
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - name: Unit tests (Vitest)
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: End-to-end tests (Playwright)
        working-directory: frontend
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report, retention-days: 7 }
